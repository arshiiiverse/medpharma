<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Medpharma — FAQ. Concept project by Arshdeep Kaur. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQs & Help — Medpharma</title>
  <meta name="description" content="Answers about Medpharma orders, delivery, prescriptions, payments, returns, lab tests and doctor consultations." />
  <meta name="theme-color" content="#123a33" />
  <link rel="canonical" href="https://arshiiiverse.github.io/medpharma/faq.html" />
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body data-page="faq">
  <div id="mp-header"></div>

  <main id="main" class="wrap" style="padding-bottom:20px">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span aria-current="page">FAQs</span></nav>
    <div class="page-title"><div><h1>Frequently asked questions</h1><p>Can't find your answer? <a class="link-arrow" href="contact.html">Contact us</a></p></div></div>

    <form class="faq-search" role="search" onsubmit="return false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label class="sr-only" for="faq-q">Search FAQs</label>
      <input id="faq-q" type="search" placeholder="Search e.g. delivery, refund, prescription…" autocomplete="off" />
    </form>
    <p id="faq-none" class="empty" hidden><b>No matching questions</b>Try another word, or <a class="link-arrow" href="contact.html">ask us directly</a>.</p>
    <div class="details" id="faqs"></div>
  </main>

  <div id="mp-footer"></div>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      'use strict';
      const FAQ = {
        'Orders & delivery': [
          ['Where do you deliver?', 'We deliver across Chandigarh (PIN codes starting 160), Mohali (140) and Panchkula (134).'],
          ['How fast is delivery?', 'Most orders arrive within 24 hours. You can track your order any time from <a class="link-arrow" href="orders.html">My orders</a>.'],
          ['Is delivery free?', 'Delivery is free on orders above ₹499. Below that, a ₹49 delivery fee applies.'],
          ['Can I cancel my order?', 'Yes — you can cancel from My orders until the order is out for delivery.']
        ],
        'Prescriptions & medicines': [
          ['Do I need a prescription?', 'Items marked <b>Rx</b> need a valid prescription from a registered doctor. Upload it at checkout or from the <b>Upload prescription</b> button, and our pharmacist will verify it.'],
          ['Are your medicines genuine?', 'Yes. We source only from licensed distributors and manufacturers, and every order is checked by a licensed pharmacist.'],
          ["What if I don't have a prescription?", 'Book a video consultation with one of our doctors — they can issue a digital prescription if it is medically appropriate.']
        ],
        'Payments, returns & refunds': [
          ['Which payment methods do you accept?', 'Cash on delivery and UPI on delivery. (This demo store does not take real payments.)'],
          ['What is your return policy?', 'Unopened, non-medicine items can be returned within 7 days. For safety reasons, opened medicines cannot be returned. Damaged or wrong items are replaced free of charge.'],
          ['When will I get my refund?', 'Refunds are processed within 3–5 working days after we receive the returned item.']
        ],
        'Lab tests & doctors': [
          ['Is home sample collection free?', 'Yes, home sample collection is free for every test booked on Medpharma.'],
          ['Do I need to fast before my test?', 'Some tests require 8–12 hours of fasting. Each test on the <a class="link-arrow" href="lab-tests.html">Lab tests</a> page shows its fasting requirement.'],
          ['How do video consultations work?', 'Book a slot on the <a class="link-arrow" href="doctors.html">Doctors</a> page. We send a secure video link to your phone, and your prescription is shared digitally after the call.']
        ]
      };
      const root = document.getElementById('faqs');
      root.innerHTML = Object.entries(FAQ).map(([group, qs]) => `
        <div class="faq-group"><h2>${group}</h2><div class="details">
          ${qs.map(([q, a]) => `<details><summary>${q}</summary><div class="content"><p>${a}</p></div></details>`).join('')}
        </div></div>`).join('');

      // FAQ structured data
      const ld = document.createElement('script');
      ld.type = 'application/ld+json';
      ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: Object.values(FAQ).flat().map(([q, a]) => ({ '@type': 'Question', name: q, acceptedAnswer: { '@type': 'Answer', text: a.replace(/<[^>]+>/g, '') } })) });
      document.head.appendChild(ld);

      document.getElementById('faq-q').addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        let shown = 0;
        root.querySelectorAll('.faq-group').forEach(g => {
          let groupShown = 0;
          g.querySelectorAll('details').forEach(d => {
            const hit = !q || d.textContent.toLowerCase().includes(q);
            d.hidden = !hit; d.open = !!q && hit;
            groupShown += hit;
          });
          g.hidden = !groupShown; shown += groupShown;
        });
        document.getElementById('faq-none').hidden = shown > 0;
      });
    })();
  </script>
</body>
</html>
